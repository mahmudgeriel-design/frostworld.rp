name: Build VolcanoEvent Plugin (Local Bukkit)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Use local Bukkit API
        run: |
          # Проверяем, существует ли локальный файл bukkit.jar
          if [ ! -f lib/bukkit-1.16.5.jar ]; then
            echo "ERROR: Local Bukkit API file not found. Please upload bukkit-1.16.5.jar to lib/ folder"
            exit 1
          fi
          cp lib/bukkit-1.16.5.jar bukkit.jar
          echo "Local Bukkit API copied successfully, size: $(ls -lh bukkit.jar)"

      - name: Create output directory
        run: mkdir -p bin

      - name: Compile plugin (Java 8 compatibility)
        run: |
          javac -d bin -sourcepath src -cp bukkit.jar -source 1.8 -target 1.8 src/com/example/volcanoevent/*.java
          if [ $? -ne 0 ]; then
            echo "Compilation failed. Check your Java code for errors."
            exit 1
          fi

      - name: Create JAR file
        run: jar cvfm VolcanoEvent.jar plugin.yml -C bin .

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolcanoEvent-jar
          path: VolcanoEvent.jar
