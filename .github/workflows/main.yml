name: Build VolcanoEvent Plugin (Java 17)


on:
  push:
    branches: [ main ]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Bukkit API for 1.16.5
        run: |
          wget https://hub.spigotmc.org/nexus/content/repositories/snapshots/org/bukkit/bukkit/1.16.5-R0.1-SNAPSHOT/bukkit-1.16.5-R0.1-SNAPSHOT.jar -O bukkit.jar


      - name: Compile plugin (Java 8 compatibility)
        run: |
          mkdir -p bin
          javac -d bin -sourcepath src -cp bukkit.jar -source 1.8 -target 1.8 src/com/example/volcanoevent/*.java

      - name: Create JAR file
        run: jar cvfm VolcanoEvent.jar plugin.yml -C bin .


      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolcanoEvent-jar
          path: VolcanoEvent.jar
