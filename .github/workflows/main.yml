name: Build VolcanoEvent Plugin (Auto‑Build Spigot)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Git LFS (required for BuildTools)
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Clone BuildTools and generate Spigot 1.16.5
        run: |
          git clone https://github.com/SpigotMC/BuildTools.git
          cd BuildTools
          echo "eula=true" > eula.txt
          java -jar BuildTools.jar --rev 1.16.5
          cp Spigot/target/spigot-*.jar ../bukkit.jar
          cd ..
          if [ ! -s bukkit.jar ]; then
            echo "ERROR: Failed to generate Spigot JAR"
            exit 1
          fi
          echo "Spigot JAR generated successfully, size: $(ls -lh bukkit.jar)"

      - name: Create output directory
        run: mkdir -p bin

      - name: Compile plugin (Java 8 compatibility)
        run: |
          javac -d bin -sourcepath src -cp bukkit.jar -source 1.8 -target 1.8 src/com/example/volcanoevent/*.java
          if [ $? -ne 0 ]; then
            echo "Compilation failed. Check your Java code for errors."
            exit 1
          fi

      - name: Create JAR file
        run: jar cvfm VolcanoEvent.jar plugin.yml -C bin .

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolcanoEvent-jar
          path: VolcanoEvent.jar
