name: Build VolcanoEvent Plugin (Java 17 with fallback)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Bukkit/Spigot API with fallback
        run: |
          if wget -q --spider https://hub.spigotmc.org/nexus/content/repositories/snapshots/org/bukkit/bukkit/1.16.5-R0.1-SNAPSHOT/bukkit-1.16.5-R0.1-SNAPSHOT.jar; then
            wget https://hub.spigotmc.org/nexus/content/repositories/snapshots/org/bukkit/bukkit/1.16.5-R0.1-SNAPSHOT/bukkit-1.16.5-R0.1-SNAPSHOT.jar -O bukkit.jar
          else
            echo "Bukkit 1.16.5 snapshot not found, using Spigot API instead"
            wget https://hub.spigotmc.org/jenkins/job/Spigot-API/1303/artifact/target/spigot-api-1.16.5-R0.1-SNAPSHOT-shaded.jar -O bukkit.jar
          fi

      - name: Compile plugin (Java 8 compatibility)
        run: |
          mkdir -p bin
          javac -d bin -sourcepath src -cp bukkit.jar -source 1.8 -target 1.8 src/com/example/volcanoevent/*.java

      - name: Create JAR file
        run: jar cvfm VolcanoEvent.jar plugin.yml -C bin .

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolcanoEvent-jar
          path: VolcanoEvent.jar
