name: Build VolcanoEvent Plugin (Using Paper API)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Paper API for 1.16.5
        run: |
          wget https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/1.16.5-R0.1-20201002.1/paper-api-1.16.5-R0.1-20201002.1.jar -O bukkit.jar
          if [ ! -s bukkit.jar ]; then
            echo "ERROR: Failed to download Paper API. File is empty or missing."
            exit 1
          fi
          echo "Paper API downloaded successfully, size: $(ls -lh bukkit.jar)"

      - name: Create output directory
        run: mkdir -p bin

      - name: Compile plugin (Java 8 compatibility)
        run: |
          javac -d bin -sourcepath src -cp bukkit.jar -source 1.8 -target 1.8 src/com/example/volcanoevent/*.java
          if [ $? -ne 0 ]; then
            echo "Compilation failed. Check your Java code for errors."
            exit 1
          fi

      - name: Create JAR file
        run: jar cvfm VolcanoEvent.jar plugin.yml -C bin .

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolcanoEvent-jar
          path: VolcanoEvent.jar
