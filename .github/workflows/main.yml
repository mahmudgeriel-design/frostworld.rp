name: Build VolcanoEvent Plugin (Fixed API Download)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Bukkit 1.16.5 (Maven Central)
        run: |
          wget https://repo1.maven.org/maven2/org/bukkit/bukkit/1.16.5-R0.1-SNAPSHOT/bukkit-1.16.5-R0.1-SNAPSHOT.jar -O bukkit.jar || \
          echo "Warning: Bukkit 1.16.5 not found, build may fail"

      - name: Compile plugin (Java 8 compatibility)
        run: |
          mkdir -p bin
          javac -d bin -sourcepath src -cp bukkit.jar -source 1.8 -target 1.8 src/com/example/volcanoevent/*.java

      - name: Create JAR file
        run: jar cvfm VolcanoEvent.jar plugin.yml -C bin .

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolcanoEvent-jar
          path: VolcanoEvent.jar
