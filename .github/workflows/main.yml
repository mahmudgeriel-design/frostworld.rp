name: Build VolcanoEvent Plugin (Reliable Method)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Bukkit API 1.16.5 (from Maven Central)
        run: |
          wget https://repo1.maven.org/maven2/org/bukkit/bukkit/1.16.5/bukkit-1.16.5.jar -O bukkit.jar
          if [ $? -ne 0 ] || [ ! -s bukkit.jar ]; then
            echo "WARNING: Bukkit 1.16.5 not found in Maven Central. Trying alternative source..."
            # Альтернативный источник — Paper API (если Maven Central не помог)
            wget https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/1.16.5-R0.1-SNAPSHOT/paper-api-1.16.5-R0.1-SNAPSHOT.jar -O bukkit.jar
            if [ $? -ne 0 ] || [ ! -s bukkit.jar ]; then
              echo "ERROR: Failed to download Bukkit/Paper API"
              exit 1
            fi
          fi
          echo "Bukkit API downloaded successfully, size: $(ls -lh bukkit.jar)"

      - name: Create output directory
        run: mkdir -p bin

      - name: Compile plugin (Java 8 compatibility)
        run: |
          javac -d bin -sourcepath src -cp bukkit.jar -source 1.8 -target 1.8 src/com/example/volcanoevent/*.java
          if [ $? -ne 0 ]; then
            echo "Compilation failed. Check your Java code for errors."
            exit 1
          fi

      - name: Create JAR file
        run: jar cvfm VolcanoEvent.jar plugin.yml -C bin .

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolcanoEvent-jar
          path: VolcanoEvent.jar
